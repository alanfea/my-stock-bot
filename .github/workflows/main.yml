name: AI 持股即時驗證雷達

on:
  schedule:
    # 台北時間 10:30 = UTC 02:30
    - cron: "30 2 * * 1-5"

  workflow_dispatch:

jobs:
  stock-radar:
    runs-on: ubuntu-latest

    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Python 環境
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests

      - name: 執行即時驗證雷達
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python stock_radar.py
