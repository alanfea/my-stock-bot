name: AI 持股即時驗證雷達

on:
  schedule:
    # 台北時間 10:30
    # GitHub Actions 使用 UTC
    # 台北 UTC+8
    # 10:30 - 8 小時 = 02:30 UTC
    - cron: "30 2 * * 1-5"

  # 可以在 GitHub Actions 手動測試
  workflow_dispatch:


jobs:
  stock-radar:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # 1. 下載 GitHub Repository 程式碼
      # ===================================================

      - name: 下載程式碼
        uses: actions/checkout@v4


      # ===================================================
      # 2. 設定 Python
      # ===================================================

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ===================================================
      # 3. 安裝套件
      # ===================================================

      - name: 安裝 Python 環境
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests


      # ===================================================
      # 4. 執行 AI 持股雷達
      # ===================================================

      - name: 執行即時驗證雷達
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Taipei

        run: |
          python stock_radar.py
