name: taiwan stock
on:
  schedule:
    # 📝 數學系思維注意：GitHub 的排程時間是國際標準時 (UTC)。
    # 台灣時間 (台北) 是 UTC+8。所以台灣的 11:30 減掉 8 小時，就是 UTC 的 03:30。
    # 這裡的設定代表：每週一到週五的 UTC 03:30 (台灣時間 11:30) 自動執行。
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # 保留這個按鈕，讓你想手動測試時隨時可以手動點執行

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 複製 GitHub 上的程式碼
      uses: actions/checkout@v3

    - name: 2. 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-type: '3.10'

    - name: 3. 安裝我們需要的數學與股票套件
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pandas-ta requests

    - name: 4. 執行即時驗證雷達
      run: python stock_radar.py
