name: AI 持股即時驗證雷達

on:
  schedule:
    # 台灣時間 10:30
    - cron: "30 10 * * 1-5"
      timezone: "Asia/Taipei"

  # 手動測試
  workflow_dispatch:

jobs:
  stock-radar:

    runs-on: ubuntu-latest

    steps:

      # 1. 下載程式碼
      - name: 下載程式碼
        uses: actions/checkout@v4

      # 2. 設定 Python
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 安裝套件
      - name: 安裝 Python 環境
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests

      # 4. 顯示執行時間
      - name: 檢查執行時間
        run: |
          echo "UTC time:"
          date -u

          echo "Taipei time:"
          TZ=Asia/Taipei date

      # 5. 執行 AI 持股雷達
      - name: 執行即時驗證雷達
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Taipei

        run: |
          python stock_radar.py
