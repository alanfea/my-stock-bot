yamlname: 每日台股即時監控排程

on:
  schedule:
    # 台灣時間中午 11:30 自動執行
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # 保留這個按鈕，讓我們可以隨時手動點擊執行測試！

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 複製程式碼
      uses: actions/checkout@v3
    - name: 2. 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: 3. 安裝數學與股票套件
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pandas-ta requests
    - name: 4. 執行即時驗證雷達並推播
      run: python stock_radar.py
